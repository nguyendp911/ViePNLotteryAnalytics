name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS device application
        run: |
          xcodebuild -project ios/ViePNLottery.xcodeproj -scheme ViePNLottery -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ViePNLottery.app Payload/
          zip -qry ViePNLottery-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ViePNLottery-unsigned
          path: ViePNLottery-unsigned.ipa
