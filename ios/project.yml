name: ViePNLottery
options:
  bundleIdPrefix: com.viepn
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.9'
targets:
  ViePNLottery:
    type: application
    platform: iOS
    sources: [ViePNLottery]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.viepn.lotteryanalytics
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: ViePN Lottery
      TARGETED_DEVICE_FAMILY: '1'
      CODE_SIGNING_ALLOWED: NO
